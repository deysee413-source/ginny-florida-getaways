function Reveal({ children, className = "", delay = 0, as = "div" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("in"); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return React.createElement(as, { ref, className: `reveal ${className}`, style: { transitionDelay: `${delay}ms` } }, children);
}

/* ---------- Lightbox ---------- */
function Lightbox({ items, index, tone, onClose, onNav }) {
  const closeRef = useRef(null);
  useEffect(() => {
    closeRef.current && closeRef.current.focus();
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight") onNav(1);
      if (e.key === "ArrowLeft") onNav(-1);
    };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose, onNav]);
  const [k, alt] = items[index];
  return html`<div className="fixed inset-0 z-[100] bg-[#0F2A3B]/95 flex flex-col" role="dialog" aria-modal="true" aria-label="Photo gallery">

    </div>
    <div className="flex-1 flex items-center justify-center px-4 md:px-20 pb-6 relative" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <button onClick=${() => onNav(-1)} className="absolute left-2 md:left-6 p-3 rounded-full bg-white/10 hover:bg-white/20 text-white" aria-label="Previous photo"><${Icon} name="left" className="w-6 h-6" /></button>

function Contact({ defaultProperty = "" }) {
  const [f, setF] = useState({ name: "", email: "", property: defaultProperty, checkin: "", checkout: "", guests: "", message: "" });
  const [status, setStatus] = useState({ kind: "idle", msg: "" });
  const [copied, setCopied] = useState(false);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const summary = () => `Inquiry for Ginny Adkins | Florida Getaways
Name: ${f.name}
Email: ${f.email}
Property: ${f.property || "Not sure yet"}
Dates: ${f.checkin || "?"} to ${f.checkout || "?"}
Guests: ${f.guests || "?"}

${f.message}`;
  const submit = async (e) => {
    e.preventDefault();
    if (!f.name.trim() || !/^\S+@\S+\.\S+$/.test(f.email) || !f.message.trim()) {
      setStatus({ kind: "error", msg: "Please add your name, a valid email address and a message." }); return;
    }
    if (f.checkin && f.checkout && f.checkout <= f.checkin) {
      setStatus({ kind: "error", msg: "Your check-out date needs to be after your check-in date." }); return;
    }
    if (!CONFIG.formEndpoint) {
      setStatus({ kind: "notconnected", msg: "" }); return;
    }
    setStatus({ kind: "sending", msg: "" });
    try {
      const res = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(f) });
      if (!res.ok) throw new Error(String(res.status));
      setStatus({ kind: "sent", msg: "" });
      setF({ name: "", email: "", property: defaultProperty, checkin: "", checkout: "", guests: "", message: "" });
    } catch (err) {
      setStatus({ kind: "error", msg: "Sorry, your inquiry couldn't be sent. Please try again, or message Ginny through Airbnb." });
    }
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(summary()); setCopied(true); setTimeout(() => setCopied(false), 2500); } catch (e) { setCopied(false); }
  };
  return html`<section id="contact" className="py-24 md:py-32 bg-sand/35 scroll-mt-20">
    <div className="max-w-7xl mx-auto px-5 lg:px-8 grid lg:grid-cols-5 gap-12">

          <li className="flex items-center gap-3"><span className="w-10 h-10 rounded-full bg-white flex items-center justify-center"><${Icon} name="mail" className="w-4 h-4" /></span>
            ${CONFIG.email ? html`<a className="hover:text-navy underline-offset-4 hover:underline" href=${`mailto:${CONFIG.email}`}>${CONFIG.email}</a>` : html`<span className="text-navy/50">[Business email to be added]</span>`}</li>
          <li className="flex items-center gap-3"><span className="w-10 h-10 rounded-full bg-white flex items-center justify-center"><${Icon} name="phone" className="w-4 h-4" /></span>
            ${CONFIG.phone ? html`<a className="hover:text-navy underline-offset-4 hover:underline" href=${`tel:${CONFIG.phone.replace(/[^\d+]/g, "")}`}>${CONFIG.phone}</a>` : html`<span className="text-navy/50">[Phone number to be added]</span>`}</li>
          ${CONFIG.social.youtube ? html`<li className="flex items-center gap-3"><span className="w-10 h-10 rounded-full bg-white flex items-center justify-center"><${Icon} name="youtube" className="w-4 h-4" /></span><${ExtLink} href=${CONFIG.social.youtube} className="hover:text-navy hover:underline underline-offset-4">Ginny on YouTube<//></li>` : null}
          <li className="flex items-center gap-3"><span className="w-10 h-10 rounded-full bg-white flex items-center justify-center"><${Icon} name="key" className="w-4 h-4" /></span>
            <span>Prefer Airbnb? Message Ginny from the <${ExtLink} href=${CONFIG.airbnb.sunseeker} className="underline underline-offset-4">Sunseeker<//> or <${ExtLink} href=${CONFIG.airbnb.serenity} className="underline underline-offset-4">Serenity Sprout<//> listing.</span></li>
        </ul>
      </div>
      <${Reveal} className="lg:col-span-3">

function PrivacyModal({ onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    ref.current && ref.current.focus();
    const k = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", k); document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", k); document.body.style.overflow = ""; };
  }, [onClose]);
  return html`<div className="fixed inset-0 z-[100] bg-[#0F2A3B]/70 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="pp-title" onClick=${(e) => e.target === e.currentTarget && onClose()}>

      <div className="flex justify-between items-start gap-4"><h2 id="pp-title" className="font-serif text-3xl">Privacy Policy</h2>

      <div className="mt-4 space-y-3 text-sm text-navy/75 leading-relaxed">
        <p>This website showcases our vacation rental homes. We do not take bookings or payments here; all reservations are made on Airbnb and are subject to Airbnb's own terms and privacy policy.</p>

  </div>`;

function App() {
  const [route, setRoute] = useState(readRoute());
  const pending = useRef(null);
  useEffect(() => {
    const on = () => { setRoute(readRoute()); };
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  // after a route render, scroll to pending section or top
  useEffect(() => {
    const target = pending.current; pending.current = null;
    requestAnimationFrame(() => {
      if (target && target !== "top") { const el = document.getElementById(target); if (el) { el.scrollIntoView({ behavior: "smooth" }); return; } }
      window.scrollTo({ top: 0, behavior: target === "top" ? "smooth" : "auto" });
    });
  }, [route]);
  const go = useCallback((r, section) => {
    if (r === route) {
      if (section && section !== "top") { const el = document.getElementById(section); if (el) { el.scrollIntoView({ behavior: "smooth" }); return; } }
      window.scrollTo({ top: 0, behavior: "smooth" }); return;
    }
    pending.current = section || null;
    const newHash = r === "home" ? "home" : r;
    if (location.hash.replace("#", "") === newHash) setRoute(r); else location.hash = newHash;
    setRoute(r);
  }, [route]);
  const p = PROPERTIES[route];
  return html`<div>
    <${Nav} route=${route} go=${go} />
    <main id="main" tabIndex="-1" className="outline-none">
      ${p ? html`<${PropertyPage} key=${route} p=${p} go=${go} />` : html`<${Home} go=${go} />`}
    </main>
    ${p ? html`<${Contact} defaultProperty=${p.id === "sunseeker" ? "Sunseeker Getaway (South Daytona)" : "Serenity Sprout Retreat (Deltona)"} key=${"c" + route} />` : null}
    <${Footer} go=${go} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
